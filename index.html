 {name:'02 / Market Reading',short:'Market Reading',desc:'Learn price action and the limits of technical tools.',icon:'chart'},
 {name:'03 / Capital Defense',short:'Capital Defense',desc:'Control position size, exits, leverage, and losses.',icon:'shield'},

{id:'f1',stage:0,title:'What is Forex?',minutes:12,tag:'Start here',summary:'Currency trading is a relative-price market. Every quote compares two currencies.',points:[
'Forex means foreign exchange. EUR/USD at 1.0850 means one euro is worth 1.0850 US dollars at the quoted price.',
'The first currency is the base. The second is the quote. Buying EUR/USD means buying euros while selling dollars. Selling EUR/USD reverses the direction.',
'The exchange rate changes with interest-rate expectations, growth, inflation, risk sentiment, and supply and demand.',
'Retail spot forex often trades over the counter through dealers. There is no single global retail exchange price.'

{id:'f2',stage:0,title:'Bid, ask, and spread',minutes:14,tag:'Costs first',summary:'Your trade starts with a transaction cost, even before the market moves.',points:[
'The bid is the price at which you sell the base currency. The ask is the price at which you buy it.',
'The spread is ask minus bid. Brokers also sometimes charge commissions or overnight financing.',
'A BUY opens at ask and closes at bid. A SELL opens at bid and closes at ask. This is why opening profit and loss starts negative.',
'Spreads often widen during volatility, thin liquidity, and major economic news. A quoted spread is not necessarily constant.'
],example:'EUR/USD bid 1.08500 and ask 1.08512 gives a 1.2-pip spread. A 0.10-lot position costs roughly $1.20 to cross that spread.',task:'Open the simulator, find its spread, and compare the bid with the ask before trading.',questions:[

'Pip values for other pairs, such as USD/JPY, vary with the exchange rate and account currency. Do not assume every pair pays $10 per pip.'
],example:'At EUR/USD, a 25-pip loss on 0.10 lot is 25 × $1 = $25, before any separately charged commission.',task:'Use the risk calculator for 0.50% of a $10,000 account and a 25-pip stop.',questions:[
q('A micro lot equals...',['100,000 units','10,000 units','1,000 units','100 units'],2,'A micro lot is 0.01 standard lot.'),q('One EUR/USD pip is typically...',['0.01','0.0001','0.001','1.0'],1,'Most non-JPY pairs use four decimal places for one pip.'),q('A 20-pip move on 0.10 EUR/USD lot is worth...',['$2','$20','$200','$2,000'],1,'Each pip is $1 on 0.10 lots for USD-quoted pairs.'),q('Is the pip value always $10 per standard lot in every FX pair?',['Yes','Only during London trading','No','Only on Tuesdays'],2,'It depends on pair, lot size, conversion rate and account currency.')
]},
{id:'f4',stage:0,title:'Sessions and order types',minutes:14,tag:'Mechanics',summary:'Understand order instructions and the hours when markets move.',points:[
'Major FX trading generally follows a near-24-hour weekday cycle through Asia, London, and New York. Holidays and venue hours differ.',
'A market order seeks immediate execution at an available price. The final fill differs from the quoted price during fast markets.',
'A limit order specifies a price or better but does not guarantee execution. A stop order activates when the trigger is reached and does not guarantee the fill price.',
'A stop loss caps a planned price level, not an absolute dollar maximum. Gaps, slippage, and margin liquidation alter outcomes.'
],example:'A BUY stop at 1.1050 activates if price rises to its trigger. It does not guarantee a fill at exactly 1.1050.',task:'Write down why a limit order and a stop loss do not offer the same kind of price guarantee.',questions:[
q('Which order seeks immediate execution?',['Limit','Market','Good-till-cancelled only','Take profit only'],1,'A market order requests execution now.'),q('A limit order guarantees...',['A filled trade','A specific profit','A limit price or better if filled','A tight spread'],2,'It trades at the limit or better, but can remain unfilled.'),q('An activated stop order always fills at the trigger price.',['True','False','Only with leverage','Only on Mondays'],1,'Stops may slip and fill worse than their trigger.'),q('Most FX trading operates...',['Only 9:30 AM to 4 PM New York','Near 24 hours through the trading week','Only Sunday','Only London afternoons'],1,'Forex sessions overlap during the week.')
]},
{id:'m1',stage:1,title:'Candlestick anatomy',minutes:16,tag:'Reading',summary:'Read open, high, low, and close without treating candles as certainty.',points:[
'A candle summarizes four prices for its time window: open, high, low, and close.',
'A candle with close above open is commonly drawn in a rising color. The body connects open to close, while wicks show the extremes.',
'A long wick shows a move was rejected within the bar, but does not identify who traded or predict the next candle.',
'A 1-hour candle contains much more activity than a 1-minute candle. Changing timeframes changes the story you see.'
],example:'A candle opens at 1.1000, trades to 1.1030, dips to 1.0990, and closes at 1.1020. Its body is 20 pips and total range is 40 pips.',task:'Inspect 10 simulator candles and identify two with long lower wicks.',questions:[
q('OHLC means...',['Open, high, low, close','Offer, hold, limit, cash','Open, hedge, leverage, cost','Only high and low count'],0,'Candles report four price measurements.'),q('A candle wick represents...',['Only the close','Intrabar price extremes','Trader identity','Guaranteed support'],1,'Wicks reach the interval high and low.'),q('If close is above open, the candle is generally...',['Bullish','Bearish','Invisible','A margin call'],0,'Rising candles close higher than they opened.'),q('A long wick alone proves the next move.',['True','False','Only on EUR/USD','Only in a range'],1,'A single candle gives no guaranteed forecast.')
]},
{id:'m2',stage:1,title:'Trend and market structure',minutes:17,tag:'Reading',summary:'Distinguish directional trends from noisy back-and-forth movement.',points:[
'An uptrend often creates higher swing highs and higher swing lows. A downtrend often creates lower highs and lower lows.',
'A range shifts around a repeated area without establishing sustained higher or lower swing structure.',
'Trend labels depend on timeframe. A 5-minute rally exists inside a daily downtrend.',
'Technical structure is a description of past prices. Avoid interpreting it as a deterministic forecast.'
],example:'Swing highs at 1.1010, 1.1030, and 1.1060 together with rising lows support an uptrend description.',task:'Choose Uptrend and then Range in the practice lab. Describe the different patterns.',questions:[
q('Higher highs and higher lows suggest...',['Uptrend','Downtrend','No volatility','Fixed price'],0,'Both swing highs and swing lows are rising.'),q('Lower highs and lower lows suggest...',['Uptrend','Downtrend','Guaranteed reversal','Stable spread'],1,'Both swing levels are falling.'),q('A 5-minute uptrend means the daily chart is also rising.',['True','False','Only with two indicators','Only at market open'],1,'Different timeframes can disagree.'),q('A range is generally characterized by...',['Repeated oscillation between areas','Only green candles','Zero spread','A guaranteed breakout'],0,'Price repeatedly visits upper and lower zones.')
]},
{id:'m3',stage:1,title:'Support, resistance, and zones',minutes:16,tag:'Structure',summary:'Mark areas where price has reacted without expecting exact turning points.',points:[
'Support is an area where buying has previously interrupted declines. Resistance is an area where selling has previously interrupted rises.',
'Prices seldom react to a single perfect line. Use zones and note where the invalidation point belongs.',
'A break above prior resistance sometimes becomes a retest area, but failed breaks are common.',
'A technical level matters only inside a documented plan with entry, stop, size, target, and conditions for skipping.'
],example:'If price rejected 1.0950 multiple times, treat 1.0945 to 1.0955 as a possible zone rather than an exact price guarantee.',task:'Write one potential support zone and one resistance zone from your chart. Include why the zones matter.',questions:[
q('Support is best treated as a...',['Guaranteed floor','Possible reaction zone','Broker fee','Specific lot size'],1,'Support is a historical reaction area, not a promise.'),q('Why mark zones instead of perfect lines?',['Prices always repeat exactly','Market reactions are imprecise','Zones eliminate losses','Zones remove spreads'],1,'Real price behavior has noise and variable execution.'),q('A broken resistance level must become support.',['True','False','Only on AUD/USD','Only at night'],1,'Role reversals are possibilities, not rules.'),q('A trading level is most useful when paired with...',['A risk and invalidation plan','No stop','Maximum leverage','An influencer signal'],0,'Plan the risk before the entry.')
]},
{id:'m4',stage:1,title:'Indicators and timeframes',minutes:18,tag:'Context',summary:'Use moving averages and volatility measures as tools, not instructions.',points:[
'A simple moving average smooths the last N closing prices. A longer average changes more slowly.',
'An exponential moving average (EMA) gives greater weight to recent prices. The lab overlays 20- and 50-period EMAs.',
'Average true range (ATR) summarizes recent price ranges. It describes historical volatility and does not set a guaranteed future range.',
'Indicators built from price lag the market. Test a small set of tools and avoid changing rules after seeing results.'
],example:'If an EMA20 rises above EMA50, the recent average has strengthened relative to the longer average. This is context, not a stand-alone buy order.',task:'Toggle the chart’s EMA overlays and explain where each lags the price.',questions:[
q('A 20-period moving average uses...',['Only one candle','Prices over 20 periods','20 currency pairs','20 brokers'],1,'A period means one chart bar.'),q('ATR mainly describes...',['Historical movement range','Guaranteed return','Interest paid','Tax due'],0,'ATR measures volatility, not direction or profit.'),q('EMAs eliminate false trading signals.',['Yes','No','Only when both rise','Only on 1-hour charts'],1,'Indicators are imperfect summaries.'),q('For beginner analysis, using fewer well-defined indicators helps...',['Make every trade win','Reduce arbitrary rule changes','Eliminate spread','Predict every news event'],1,'Simpler rules are easier to test consistently.')
]},
{id:'r1',stage:2,title:'Risk per trade and position sizing',minutes:20,tag:'Core skill',summary:'Choose loss size before choosing trade size.',points:[
'Start with the maximum dollar loss you accept. A 0.5% risk plan risks $50 on a $10,000 account.',
'For USD-quoted pairs, standard-lot pip value is $10. Lots = risk dollars ÷ (stop distance in pips × $10).',
'Round down to an available lot increment so the planned risk is not exceeded. If the smallest increment is too big, skip the trade.',
'The practice terminal limits risk to 1% of equity per trade. This is a training control, not a claim of universal suitability.'
],example:'$10,000 × 0.5% = $50. With a 25-pip stop, $50 ÷ (25 × $10) = 0.20 standard lot.',task:'Compute a position for $7,500, risk 0.5%, and stop 30 pips. Then check it in the calculator.',questions:[
q('0.5% of $10,000 equals...',['$5','$50','$500','$1,000'],1,'$10,000 × 0.005 = $50.'),q('With fixed dollar risk, doubling stop distance should...',['Double position size','Halve position size','Leave size unchanged','Remove the spread'],1,'Risk equals stop pips times pip value times lot size.'),q('A calculated 0.006 lot when broker minimum is 0.01 means...',['Round up automatically','Skip or change the risk plan','Double leverage','Ignore the stop'],1,'Never exceed the approved dollar risk by rounding up.'),q('A stop loss guarantees the planned maximum dollar loss.',['Always','Never exactly','Only in demos','Only without spread'],1,'Slippage, gaps and execution can lead to worse fills.')
]},
{id:'r2',stage:2,title:'Stops and reward-to-risk',minutes:18,tag:'Core skill',summary:'Define where a trade idea fails and whether the potential payoff is worthwhile.',points:[
'A stop should express the point where the trade hypothesis becomes invalid. It should not be moved farther away to avoid a loss.',
'A take-profit level specifies a planned exit for a winning move. Define it before entry rather than after emotions rise.',
'If the stop is 20 pips and the target is 40 pips, planned reward-to-risk is 2:1, before unpredictable slippage and any separate fees.',
'Higher reward-to-risk does not automatically create an edge. A low hit rate erases impressive-looking targets.'
],example:'One win at +2R and two losses at -1R each produce 0R total before any extra costs. Here R means initial risk.',task:'Explain your stop and target for the next simulated trade in one full sentence.',questions:[
q('A 30-pip target with a 15-pip stop gives planned reward-to-risk of...',['1:2','2:1','1:1','3:1'],1,'30 ÷ 15 = 2.'),q('A stop should primarily reflect...',['Where the setup is invalidated','Your wish to avoid losses','The broker advertisement','The day of the week'],0,'The stop is part of a repeatable trade hypothesis.'),q('Moving a stop farther away after entry typically...',['Cuts planned risk','Raises potential risk','Removes slippage','Improves certainty'],1,'Widening the stop without reducing size increases potential loss.'),q('A 4:1 target guarantees positive expectancy.',['Yes','No','Only with trends','Only in majors'],1,'Win frequency and transaction costs matter.')
]},
{id:'r3',stage:2,title:'Margin, leverage, and liquidation',minutes:21,tag:'High priority',summary:'A small price move against a leveraged position creates large account losses.',points:[
'Leverage means controlling a larger position with less collateral. At 20:1, a $20,000 notional position needs about $1,000 initial margin.',
'Margin is not your planned loss amount. Losses come from the full notional exposure and how far the price moves.',
'Brokers apply maintenance margin and liquidation rules. Closing at a stop is not guaranteed during gaps or disruptions.',
'In the United States, retail forex regulatory limits differ by pair category, and regulation does not make a strategy profitable. This simulator voluntarily caps leverage at 20:1.'
],example:'On $2,000 equity, a $40,000 position at 20:1 uses $2,000 margin. A 1% adverse move on the position is roughly $400, or 20% of the equity.',task:'Use the terminal size preview to compare required margin with maximum planned stop loss.',questions:[
q('Leverage of 20:1 on $1,000 margin permits approximately...',['$1,000 notional','$2,000 notional','$20,000 notional','$200,000 notional'],2,'20 × $1,000 = $20,000.'),q('Margin and stop-loss risk are...',['Exactly the same','Different quantities','Both fixed fees','Always zero'],1,'Margin is collateral. Price movement determines P&L.'),q('High leverage tends to...',['Amplify gains and losses','Remove risk','Guarantee easy exits','Fix spreads'],0,'P&L changes relative to a smaller capital base.'),q('A broker margin closeout may happen...',['If equity becomes insufficient','Only after taking profit','Only on Sundays','Only if there are no losses'],0,'Margin rules can force liquidation.')
]},
{id:'r4',stage:2,title:'Expectancy and drawdown',minutes:20,tag:'Numbers that matter',summary:'Evaluate many outcomes and defend against compounding losses.',points:[
'Expectancy per trade = (win rate × average win) minus (loss rate × average loss), after costs.',
'A strategy winning 40% of trades with an average 2R win and 1R loss has 0.4×2R − 0.6×1R = +0.2R before extra fees.',
'Drawdown is the decline from an account equity peak. A 20% drawdown needs a 25% gain just to recover.',
'Sample size matters. Ten successful simulated trades are insufficient evidence of a durable trading advantage.'
],example:'40 winners at +$80 and 60 losers at −$40 = $3,200 − $2,400 = +$800 across 100 trades, before additional expenses.',task:'Review your analytics after at least five trades, then explain expectancy and maximum drawdown.',questions:[
q('A win rate above 50% is required for positive expectancy.',['True','False','Only with 1:2 targets','Only on EUR/USD'],1,'Average win size, loss size, and costs also determine expectancy.'),q('A 20% drawdown requires what gain from the low to break even?',['20%','25%','30%','40%'],1,'To return from 80 to 100, gain 20/80 = 25%.'),q('Expectation per trade should include...',['Only winning trades','Wins, losses and costs','Only trade frequency','Only chart patterns'],1,'All financial outcomes affect long-run expectancy.'),q('Five winning trades prove a profitable strategy.',['Yes','No','Only if all are at 2R','Only if consecutive'],1,'Small samples are dominated by chance.')
]},
{id:'s1',stage:3,title:'Trend pullback playbook',minutes:20,tag:'Setup design',summary:'Create specific rules for entering with, not blindly chasing, a trend.',points:[
'First define trend structure on a chosen timeframe, for example higher highs and higher lows.',
'Wait for price to pull back toward a previously tested zone. Record evidence of renewed buying or selling before entering.',
'Place the stop beyond the point that invalidates the structure. Calculate lot size from the stop, then assess target and costs.',
'If the setup is missing, skipping counts as following your plan. A strategy is a testable rule, not a prediction.'
],example:'Example hypothesis: in an uptrend, wait for a pullback to an earlier swing zone, then enter only after a confirmed higher low. Stop below the new low.',task:'Write an entry trigger, an invalidation stop, a target, and a no-trade condition.',questions:[
q('A pullback strategy typically enters...',['After every green candle','After a countertrend pause inside a larger trend','Only during news','Without a stop'],1,'It waits for a pause and a defined resumption trigger.'),q('The proper order is...',['Size, then pick any stop','Stop distance, then calculate size','Profit first, then entry','Enter first, then invent rules'],1,'Position size depends on planned stop distance.'),q('No valid setup means...',['Force a trade','Wait or skip','Double lot size','Switch direction immediately'],1,'Skipping poor setups is disciplined execution.'),q('An uptrend pullback guarantees resumption.',['Yes','No','Only with EMA20','Only with two green candles'],1,'Trend setups fail regularly.')
]},
{id:'s2',stage:3,title:'Range setup and false breakouts',minutes:18,tag:'Setup design',summary:'Trade only when evidence supports a range and the exit plan is clear.',points:[
'A range strategy observes repeated reactions near a lower and upper zone. The middle often offers a weaker payoff relative to risk.',
'An apparent breakout may quickly return inside the range. Wait for an objective confirmation rule if your plan requires one.',
'Never assume a zone will hold. Changes in volatility or major news often invalidate familiar boundaries.',
'Compare potential reward to the opposite side of the range with the stop distance and transaction costs.'
],example:'If support lies near 1.1000 and resistance near 1.1060, buying near 1.1055 offers little room to the upper zone.',task:'Find a range session and identify where you would refuse a trade despite an attractive-looking candle.',questions:[
q('A range trader often watches...',['A repeated upper and lower zone','Only price highs','Only interest rates','Only overnight swaps'],0,'Ranges oscillate between areas.'),q('Entering near the middle of a range often means...',['Less attractive room to either boundary','Guaranteed profit','No spread','No stop needed'],0,'Available upside relative to a stop may be limited.'),q('A false breakout is...',['Price leaving a zone then returning','Guaranteed trend continuation','A rejected bank deposit','A zero-volume pair'],0,'Not all boundary breaks continue.'),q('Ranges remain valid regardless of economic events.',['True','False','Only on GBP/USD','Only on daily charts'],1,'Market conditions can change sharply.')
]},
{id:'s3',stage:3,title:'Economic releases and event risk',minutes:21,tag:'Macro',summary:'Learn why central banks and economic releases move currency expectations.',points:[
'Currency markets respond to changing expectations about interest rates, inflation, employment, growth, and policy statements.',
'The surprise relative to market expectations often matters more than the headline number alone.',
'Important releases can trigger wider spreads, slippage, gaps, and sharp reversals. Observing rather than trading is a valid plan.',
'Use an actual economic calendar when trading real markets. This offline simulator does not provide real event times or real-time data.'
],example:'If inflation prints above expectations, a currency might rise on rate expectations, but positioning and policy context can reverse the reaction.',task:'Run the News shock practice scenario and observe how entry costs and stop fills differ.',questions:[
q('The market reaction to an economic report often depends on...',['The surprise relative to expectations','Only the report title','The name of a broker','Whether a candle is green'],0,'Markets reprice when new information differs from expectations.'),q('During major news, spreads generally...',['Must narrow','Sometimes widen considerably','Become zero','Disappear'],1,'Uncertain liquidity often increases spreads.'),q('It is acceptable to skip trading during major announcements.',['Yes','No','Only when profitable','Only during a demo'],0,'Skipping is a legitimate risk rule.'),q('This app uses live central-bank release feeds.',['Yes','No','Only on desktop','Only for EUR/USD'],1,'Its market scenarios are synthetic and offline.')
]},
{id:'s4',stage:3,title:'Test a strategy without fooling yourself',minutes:19,tag:'Testing',summary:'Separate strategy development from honest out-of-sample checking.',points:[
'Write objective entry, exit, timeframe, cost, and position-sizing rules before reviewing the result.',
'Backtesting uses historical observations. Forward testing evaluates rules on later, unseen data. Synthetic data is useful for mechanics but not profitability validation.',
'Look for look-ahead bias, overfitting, survivorship bias, missing slippage, and changed rules after losses.',
'Keep a versioned trading plan. Compare results over many market regimes and enough trades to estimate the uncertainty.'
],example:'Testing 50 different indicator combinations and reporting only the best without a fresh sample exaggerates apparent performance.',task:'Choose one simple setup, document the rules, and commit to 30 demo trades without rewriting them mid-test.',questions:[
q('Changing your rules to fit past charts is a risk called...',['Overfitting','Compounding interest','Inflation targeting','Hedging'],0,'Fitted strategies may fail on unseen data.'),q('Out-of-sample testing uses...',['Data excluded from strategy design','Exactly the training bars','Only winning trades','Broker advertisements'],0,'An unseen period is a stronger test.'),q('Synthetic candles prove profitability on real markets.',['Yes','No','Only after 10 wins','Only on a range'],1,'Synthetic training environments lack many live-market forces.'),q('What should be written before testing?',['Specific entry and exit rules','Only desired profits','A prediction of exact returns','A new rule after every loss'],0,'Predetermined rules limit hindsight bias.')
]},
{id:'p1',stage:4,title:'Your written trading plan',minutes:18,tag:'Discipline',summary:'Build a decision checklist that protects you from impulse trades.',points:[
'Select a pair, timeframe, trading hours, one tested setup, news blackout policy, and specific reasons to avoid trading.',
'Set fixed risk limits before opening the platform. The lab uses a maximum of 1% per trade and a 2% realized-loss session pause.',
'Record entry trigger, invalidation, target, expected costs, and a written reason for each trade.',
'Review the plan on a schedule, not because one losing trade feels frustrating.'
],example:'Example: EUR/USD only, 1-hour chart, trend-pullback setup, 0.5% risk, target at least 1.5R, no trading around major scheduled news.',task:'Use the plan worksheet in the Academy home screen to write your personal no-trade rules.',questions:[
q('A trading plan should be defined...',['Before trading','After losing','Only after 100 wins','By social-media votes'],0,'Precommitted decisions support consistency.'),q('A no-trade condition belongs in a plan.',['Yes','No','Only for beginners','Only during holidays'],0,'Knowing when to stand aside is essential.'),q('After one loss, the best response is usually...',['Double position size','Check execution against the plan','Remove the stop','Abandon all rules'],1,'Evaluate whether the process was followed.'),q('Which is a measurable rule?',['Trade when the vibe feels right','0.5% risk and a 25-pip stop','Win today','Never lose'],1,'Measurable rules are testable.')
]},
{id:'p2',stage:4,title:'Trading psychology and bias',minutes:20,tag:'Discipline',summary:'Identify behavior that quietly increases risk.',points:[
'Loss aversion tempts traders to hold losers and cut winners early. Recency bias overweights the latest outcome.',
'FOMO encourages chasing a move after the entry has passed. Revenge trading increases size or frequency after a loss.',
'Use a pretrade checklist and a daily stop rule. Your objective is consistent execution, not emotional certainty.',
'Rest and review after repeated errors. More trades do not correct an undisciplined process.'
],example:'After two losses, a trader doubles risk to recover quickly. This changes the planned risk profile and compounds drawdown danger.',task:'Write one sentence describing the emotion most likely to cause you to break a rule and a specific response.',questions:[
q('Revenge trading often means...',['Raising risk after a loss','Following a fixed checklist','Reducing size after volatility','Skipping an unclear setup'],0,'It reacts to losses by increasing exposure.'),q('FOMO most often causes...',['Chasing a missed move','Better recordkeeping','Less frequent trades','Lower spreads'],0,'Fear of missing out encourages late, unplanned entries.'),q('A pretrade checklist primarily supports...',['Repeatable decisions','Guaranteed returns','Perfect entries','Zero volatility'],0,'It shifts the decision toward written criteria.'),q('After breaking your rules repeatedly, you should...',['Increase leverage','Stop, log the errors, and reassess','Hide the journal','Trade faster'],1,'A pause helps prevent escalating mistakes.')
]},
{id:'p3',stage:4,title:'Trade journal and review',minutes:18,tag:'Evidence',summary:'Use a journal to improve decisions, not to collect winning screenshots.',points:[
'Before entry, record your setup, timeframe, stop, target, and reason for entering.',
'After exit, record whether you followed the plan and what the trade taught you. A losing trade executed perfectly is still valuable data.',
'Track win rate, average gain and loss, expectancy, maximum drawdown, and journal completion rate.',
'Identify process errors separately from normal losses. Assess a series of comparable trades instead of rewriting a strategy after one outcome.'
],example:'A trade loses −1R despite a valid signal and correct stop. Journal it as a process success with a financial loss.',task:'Complete a meaningful posttrade note for every practice trade, including losses.',questions:[
q('A rule-following losing trade is...',['Always a process failure','Potentially good execution with a bad outcome','Proof the broker is fraudulent','Reason to double risk'],1,'Process quality and financial outcome differ.'),q('An effective journal includes...',['Only winners','Entry reason and posttrade reflection','Only daily balance','Only screenshots'],1,'Both the decision and its review matter.'),q('Which measures drawdown?',['Decline from a prior equity peak','Number of candles','Only today’s spread','Gross revenue'],0,'Drawdown tracks equity lost from prior highs.'),q('A journal should encourage...',['Selective reporting','Consistent review of all trades','Ignoring fees','Removing losses'],1,'Unbiased records give useful feedback.')
]},
{id:'p4',stage:4,title:'Choosing a broker and the real-world gap',minutes:23,tag:'Final gate',summary:'Recognize what a training app cannot recreate and how to verify a dealer.',points:[
'Check US dealer registration and disciplinary history with the CFTC and National Futures Association BASIC. Read the firm’s risk disclosure and complete fee schedule.',
'Assess spreads, commissions, financing, execution quality, margin closeout rules, withdrawal procedures, and customer support. Test operations using a regulated broker demo first.',
'Live order fills, overnight financing, psychological pressure, liquidity shocks, taxes, and news volatility differ from an offline chart exercise.',
'Do not treat an app completion badge as proof you will profit. The CFTC reports that roughly two-thirds of OTC retail forex customers lose money in a typical period. Never fund speculation with money needed for bills or long-term savings.'
],example:'Before depositing, use NFA BASIC at nfa.futures.org/basicnet to verify registration and examine disciplinary records, then read the broker’s disclosure.',task:'Complete the final assessment and continue using a regulated dealer’s live-market demo before considering real funds.',questions:[
q('Where should a US retail forex dealer be checked?',['A social media group','CFTC and NFA BASIC','A signal seller','An anonymous ranking site'],1,'Use official regulatory registration and disciplinary records.'),q('What is absent from this synthetic simulator?',['A risk calculator','Actual market liquidity and execution','A journal','Lesson quizzes'],1,'It cannot reproduce real dealer fills and trading conditions.'),q('A mastery badge means live profits are likely.',['True','False','Only on EUR/USD','Only if the demo is up'],1,'Course completion is educational, not predictive.'),q('Funds needed for rent, debt, or retirement belong in...',['A high-leverage account','A speculative trading account','Protected household and savings plans','Unregistered signals'],2,'Avoid risking essential funds.')
]}

  <script>
(function(root) {
  'use strict';
  const PAIRS = {
    'EUR/USD': { base: 1.08450, spread: 1.2, pip: 0.0001, vol: 1, name: 'Euro / US dollar' },
    'GBP/USD': { base: 1.27420, spread: 1.8, pip: 0.0001, vol: 1.3, name: 'British pound / US dollar' },
    'AUD/USD': { base: 0.66320, spread: 1.5, pip: 0.0001, vol: 0.9, name: 'Australian dollar / US dollar' },
    'NZD/USD': { base: 0.61150, spread: 1.9, pip: 0.0001, vol: 1.1, name: 'NZ dollar / US dollar' }

  const SCENARIOS = ['Uptrend', 'Downtrend', 'Range', 'News shock'];
  const money = n => Number(n || 0).toLocaleString('en-US', { style:'currency', currency:'USD', minimumFractionDigits:2, maximumFractionDigits:2 });
  const round = (n, d=2) => Number(n.toFixed(d));
  const pipValue = (lots, pair) => {
    if (!PAIRS[pair]) throw new Error('Pair not supported');
    return lots * 100000 * PAIRS[pair].pip;
  };
  // All pairs are XXX/USD. Pip values and P&L are already in the account's USD currency.
  function positionSize(equity, riskPct, stopPips, pair) {
    if (!(equity > 0 && riskPct > 0 && riskPct <= 1 && stopPips > 0 && PAIRS[pair])) return null;
    const budget = equity * riskPct / 100;
    const raw = budget / (stopPips * pipValue(1, pair));
    const lots = Math.floor((raw + 1e-9) * 100) / 100;
    if (lots < 0.01) return { lots: 0, budget: round(budget), actualRisk: 0, riskPctActual: 0, margin: 0 };
    const actualRisk = stopPips * pipValue(lots, pair);
    return { lots: round(lots, 2), budget: round(budget), actualRisk: round(actualRisk), riskPctActual: round(actualRisk/equity*100, 3), margin: 0 };
  }
  function rng(seed) { let v = (seed>>>0) || 91327; return () => { v ^= v<<13; v ^= v>>>17; v ^= v<<5; return (v>>>0) / 4294967296; }; }
  function generateMarket(pair='EUR/USD', scenario='Uptrend', seed=16, count=420) {
    const cfg=PAIRS[pair];
    if (!cfg || !SCENARIOS.includes(scenario)) throw new Error('Unsupported market');
    const random=rng(seed);
    const candles=[];
    let price=cfg.base * (1 + (random()-.5)*.012);
    const center=price;
    const unit=cfg.pip * cfg.vol;
    for(let i=0;i<count;i++) {
      const open=price;
      let drift=0;
      const noise=(random()+random()+random()-1.5)*9*unit;
      if(scenario==='Uptrend') drift=0.95*unit;
      if(scenario==='Downtrend') drift=-0.95*unit;
      if(scenario==='Range') drift=-(price-center)*0.12;
      if(scenario==='News shock') {
        drift=(i%85<38?0.7:-0.7)*unit;
        if(i===118 || i===207 || i===309) drift += (random()>.5?1:-1)*60*unit;
      }
      if (scenario==='Uptrend' || scenario==='Downtrend') drift += Math.sin(i/21)*1.15*unit;
      price=Math.max(cfg.pip*100, open+drift+noise);
      const wiggle=(1 + random()*4.8)*unit;
      candles.push({open:round(open,5),high:round(Math.max(open,price)+wiggle,5),low:round(Math.min(open,price)-wiggle*(0.45+random()*0.55),5),close:round(price,5)});
    }
    return candles;
  }
  function spreadAt(pair, scenario, index) {
    const base=PAIRS[pair].spread;
    return round(scenario==='News shock' && ((index>113 && index<125)||(index>202 && index<214)||(index>304 && index<315)) ? base+2.8 : base,1);
  }
  function quote(mid, pair, spreadPips) { const half=spreadPips*PAIRS[pair].pip/2; return {bid:round(mid-half,5),ask:round(mid+half,5)}; }
  function floatingPL(trade, mid, spreadPips) {
    if(!trade) return 0;
    const exitQuote=quote(mid,trade.pair,spreadPips);
    const close=trade.side==='BUY'?exitQuote.bid:exitQuote.ask;
    return round((trade.side==='BUY'?1:-1)*(close-trade.entry)*100000*trade.lots,2);
  }
  function checkExit(trade,candle,spreadPips,scenario) {
    if(!trade) return null;
    const half=spreadPips*PAIRS[trade.pair].pip/2;
    const isBuy=trade.side==='BUY';
    const lowExec=isBuy?candle.low-half:candle.low+half;
    const highExec=isBuy?candle.high-half:candle.high+half;
    const openExec=isBuy?candle.open-half:candle.open+half;
    const stopHit=isBuy?lowExec<=trade.sl:highExec>=trade.sl;
    const targetHit=isBuy?highExec>=trade.tp:lowExec<=trade.tp;
    let price, reason;
    if(stopHit) {
      reason='Stop loss';
      // Conservative stop-first assumption if both levels occur within one bar.
      // Synthetic fixed adverse slippage of 1 pip in news-shock scenarios.
      const slip=scenario==='News shock'?PAIRS[trade.pair].pip:0;
      price=isBuy?Math.min(trade.sl,openExec)-slip:Math.max(trade.sl,openExec)+slip;
    } else if(targetHit) {
      reason='Take profit';price=trade.tp;
    } else return null;
    price=round(price,5);
    return {price,reason, pnl:round((isBuy?1:-1)*(price-trade.entry)*100000*trade.lots,2)};
  }
  function evaluatePerformance(trades, balanceHistory) {
    const pnl=trades.reduce((a,t)=>a+t.pnl,0);
    const wins=trades.filter(t=>t.pnl>0);
    const losses=trades.filter(t=>t.pnl<0);
    const grossProfit=wins.reduce((a,t)=>a+t.pnl,0);
    const grossLoss=-losses.reduce((a,t)=>a+t.pnl,0);
    const expectancy=trades.length?pnl/trades.length:0;
    let peak=balanceHistory[0]||10000,maxDD=0;
    for(const x of balanceHistory){peak=Math.max(peak,x);maxDD=Math.max(maxDD,(peak-x)/peak*100);}
    const journalled=trades.filter(t=>(t.reflection||'').trim().length>=15).length;
    return {pnl:round(pnl),count:trades.length,wins:wins.length,losses:losses.length,winRate:trades.length?round(wins.length/trades.length*100,1):0,profitFactor:grossLoss>0?round(grossProfit/grossLoss,2):(grossProfit>0?null:0),expectancy:round(expectancy),maxDD:round(maxDD,2),journalled,journalRate:trades.length?round(journalled/trades.length*100,1):0};
  }
  const api={PAIRS,SCENARIOS,money,round,pipValue,positionSize,generateMarket,spreadAt,quote,floatingPL,checkExit,evaluatePerformance};
  root.FXLogic=api;
  if(typeof module!=='undefined'&&module.exports) module.exports=api;
})(typeof window!=='undefined'?window:globalThis);

utton class="btn secondary sm" data-action="new-scenario" ${current?'disabled':''}>Start selected session</button></div><div class="inline-actions" style="justify-content:space-between;margin:9px 0"><div><div class="caption">${esc(L.PAIRS[data.market.pair].name)} · Candle ${data.market.index+1}/${getCandles().length}</div><div class="lab-price t-num">${c.close.toFixed(5)}</div></div><div class="chip">Spread ${spread().toFixed(1)} pips</div></div><div class="chart-frame"><canvas id="priceChart" role="img" aria-label="Synthetic candlestick chart showing recent prices, exponential moving averages, and trade levels"></canvas></div><div class="chart-legend"><span><i class="dot teal"></i> Up candle / EMA 20</span><span><i class="dot blue"></i> EMA 50</span><span><i class="dot orange"></i> Entry or target</span></div><div class="controls-row"><button class="btn" data-action="next-bar" data-count="1" ${closed?'disabled':''}>Next candle ${icon('arrow')}</button><button class="btn secondary" data-action="next-bar" data-count="10" ${closed?'disabled':''}>Advance 10 candles</button><span class="caption">No look-ahead. One open trade maximum.</span></div>${closed?`<p class="warning" style="margin:13px 0">End of generated scenario. Start a new session to continue.</p>`:''}${limit?`<div class="callout red" style="margin-top:15px"><strong>Session risk stop reached</strong><p>The realized session loss met the 2% training threshold. New entries remain paused until your next practice session.</p></div>`:''}</div><div class="card" style="margin-top:18px"><h3>Replay your own historical CSV</h3><p class="notice">Upload an OHLC CSV with headers <code>open, high, low, close</code> and 100 to 2,000 candles, ordered oldest to newest. Select the matching pair above, then start a Historical CSV session. Files stay in this browser. Imported OHLC prices are provided by you. Spread and fill costs remain simplified simulations.</p><div class="inline-actions"><label class="btn secondary sm" for="csvFile">Import historical OHLC CSV</label><input id="csvFile" type="file" accept=".csv,text/csv" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0" ${current?'disabled':''}/>${data.imported?`<span class="chip teal">${esc(data.imported.name)} · ${data.imported.candles.length} bars · ${esc(data.imported.pair)}</span>`:'<span class="caption">No historical file imported</span>'}</div></div><div class="card" style="margin-top:18px"><h3>How the simulation fills orders</h3><p class="notice">BUY opens at ask and closes at bid. SELL opens at bid and closes at ask. If a candle touches both stop and target, the stop wins. A simulated 1-pip adverse stop slippage applies in the News shock regime. Overnight financing, commissions, actual liquidity, and broker liquidation are not modeled. This is training data, not a profitability backtest.</p></div></div><div class="lab-right"><div class="card order-panel"><div class="inline-actions" style="justify-content:space-between"><h3>Place a practice order</h3><span class="chip teal">Risk ≤ 1%</span></div><div class="pair-price"><div><small>SELL / BID</small><strong class="red-text t-num">${qte.bid.toFixed(5)}</strong></div><div><small>BUY / ASK</small><strong class="green t-num">${qte.ask.toFixed(5)}</strong></div></div><div class="form-grid"><div class="field"><label for="orderRisk">Account risk (%)</label><select id="orderRisk" ${current||limit||closed?'disabled':''}><option value="0.25">0.25%</option><option value="0.5" selected>0.50%</option><option value="1">1.00%</option></select></div><div class="field"><label for="orderStop">Stop distance (pips)</label><input id="orderStop" type="number" value="25" min="5" max="250" step="1" ${current||limit||closed?'disabled':''}/></div><div class="field"><label for="orderTarget">Target distance (pips)</label><input id="orderTarget" type="number" value="50" min="5" max="500" step="1" ${current||limit||closed?'disabled':''}/></div><div class="field"><label for="orderSidePreview">Preview direction</label><select id="orderSidePreview" ${current||limit||closed?'disabled':''}><option>BUY</option><option>SELL</option></select></div></div><div id="orderSizing" class="order-summary"></div><div class="field"><label for="tradeThesis">Your reason for entering (at least 12 characters)</label><textarea id="tradeThesis" placeholder="Example: In a higher-high trend, price pulled back to an earlier support zone and held." ${current||limit||closed?'disabled':''}></textarea></div><p class="checklist-title" style="margin-top:13px">Mandatory pretrade checklist</p><label class="check-item"><input type="checkbox" id="ruleSetup" ${current||limit||closed?'disabled':''}/> I identified a specific setup and entry trigger.</label><label class="check-item"><input type="checkbox" id="ruleEvent" ${current||limit||closed?'disabled':''}/> I checked event risk in this training scenario.</label><label class="check-item"><input type="checkbox" id="ruleRisk" ${current||limit||closed?'disabled':''}/> I accept the planned stop and dollar loss.</label><div class="two-way" style="margin-top:17px"><button data-action="open-trade" data-side="BUY" ${current||limit||closed?'disabled':''}>BUY / LONG</button><button class="sell" data-action="open-trade" data-side="SELL" ${current||limit||closed?'disabled':''}>SELL / SHORT</button></div><p class="caption" style="margin:11px 0 0">The model sizes in 0.01 lot steps and checks initial margin at a training limit of 20:1.</p></div><div class="card position-panel"><h3>Open position</h3>${current?`<div class="inline-actions"><span class="chip ${current.side==='BUY'?'teal':'red'}">${current.side}</span><span class="chip">${current.pair}</span></div><div class="kv"><span>Size / Entry</span><strong>${current.lots.toFixed(2)} lot · ${current.entry.toFixed(5)}</strong></div><div class="kv"><span>Stop / Target</span><strong>${current.sl.toFixed(5)} / ${current.tp.toFixed(5)}</strong></div><div class="kv"><span>Planned risk</span><strong>${fmt(current.risk)}</strong></div><div class="kv"><span>Margin used (20:1)</span><strong>${fmt(current.margin)}</strong></div><div class="kv"><span>Floating result</span><strong class="${valueClass(floating())}">${fmt(floating())}</strong></div><p class="notice" style="margin:11px 0">${esc(current.thesis)}</p><button class="btn secondary full" data-action="close-trade">Close at executable quote</button>`:`<div class="empty">No open position.<p style="margin:7px 0 0">Complete your checklist before entering a trade.</p></div>`}</div></div></div>`;}
function calculator(){return `<div class="section-heading" style="margin-top:0"><div><div class="eyebrow">Practical trading math</div><h1>Know the loss before the lot size.</h1><p class="muted">Risk sizing for major pairs quoted in USD, with a USD-denominated account.</p></div></div><div class="grid grid-2"><div class="card"><h3>Position-size calculator</h3><p class="muted">A calculator helps implement an existing risk decision. It does not identify a profitable entry.</p><div class="form-grid"><div class="field"><label for="calcBalance">Account equity (USD)</label><input id="calcBalance" type="number" min="1" value="10000" step="100"></div><div class="field"><label for="calcPct">Risk per trade (%)</label><select id="calcPct"><option value="0.25">0.25%</option><option value="0.5" selected>0.50%</option><option value="1">1.00%</option></select></div><div class="field"><label for="calcStop">Stop distance (pips)</label><input id="calcStop" type="number" min="1" max="2000" value="25"></div><div class="field"><label for="calcPair">Currency pair</label><select id="calcPair">${Object.keys(L.PAIRS).map(p=>`<option>${p}</option>`).join('')}</select></div></div><div class="example" style="margin-bottom:0"><strong>Formula</strong><p style="margin-top:9px">Risk dollars = equity × risk percentage. Lots = risk dollars ÷ (stop pips × $10 per standard lot). Round down to 0.01 lot.</p></div></div><div class="calc-output" id="calcResults" aria-live="polite"></div></div><div class="section-heading"><h2>Examples you should know</h2></div><div class="grid grid-3"><div class="card"><div class="eyebrow">Case A</div><h3>$10,000 account</h3><p class="muted">0.5% risk · 25 pip stop</p><p><strong>0.20 lots</strong> = $50 planned stop loss.</p></div><div class="card"><div class="eyebrow">Case B</div><h3>$3,000 account</h3><p class="muted">0.5% risk · 30 pip stop</p><p><strong>0.05 lots</strong> = $15 planned stop loss.</p></div><div class="card"><div class="eyebrow">Case C</div><h3>$1,000 account</h3><p class="muted">0.25% risk · 40 pip stop</p><p><strong>Skip trade</strong> if the minimum 0.01 lot exceeds $2.50 risk.</p></div></div><div class="callout amber" style="margin-top:20px"><strong>Calculator assumptions</strong><p style="margin-top:8px">EUR/USD, GBP/USD, AUD/USD, and NZD/USD all have USD as the quote currency, so one standard lot is worth $10 per pip. Real markets involve variable spread, commissions, slippage, and financing. For crosses and JPY pairs, a different conversion formula is required. This calculator intentionally excludes those pairs.</p></div>`;}
function journal(){const filtered=data.trades.filter(t=>currentJournalFilter==='all'||(currentJournalFilter==='reviewed'? (t.reflection||'').trim().length>=15:(t.reflection||'').trim().length<15)).slice().reverse();return `<div class="section-heading" style="margin-top:0"><div><div class="eyebrow">Behavior creates the evidence</div><h1>Your trade journal.</h1><p class="muted">Record why you entered, how you exited, and whether the process was followed.</p></div><span class="chip teal">${perf().journalled}/${data.trades.length} reviewed</span></div><div class="callout"><strong>What to write after every trade</strong><p style="margin-top:8px">Was the entry justified? Did you obey the original stop and target? What will you repeat or change? Describe the process independently from the money won or lost.</p></div><div class="inline-actions" style="margin:22px 0 12px"><button class="btn ${currentJournalFilter==='all'?'':'secondary'} sm" data-filter="all">All trades</button><button class="btn ${currentJournalFilter==='pending'?'':'secondary'} sm" data-filter="pending">Needs reflection</button><button class="btn ${currentJournalFilter==='reviewed'?'':'secondary'} sm" data-filter="reviewed">Reviewed</button></div>${!filtered.length?`<div class="empty">No trades in this view. <button class="btn sm" data-nav="lab">Open terminal</button></div>`:`<div class="grid">${filtered.map(t=>`<article class="card"><div class="inline-actions" style="justify-content:space-between"><div class="inline-actions"><span class="chip ${t.side==='BUY'?'teal':'red'}">${t.side}</span><strong>${t.pair}</strong><span class="caption">${esc(t.scenario)} · ${esc(t.date)}</span></div><h3 class="${valueClass(t.pnl)}">${fmt(t.pnl)} <span class="caption">(${L.round(t.pnl/t.risk,2)}R)</span></h3></div><div class="grid grid-3" style="margin:16px 0 8px"><div><small class="subtle">Entry / Exit</small><div class="t-num">${t.entry.toFixed(5)} / ${t.exit.toFixed(5)}</div></div><div><small class="subtle">Stop / Target</small><div class="t-num">${t.sl.toFixed(5)} / ${t.tp.toFixed(5)}</div></div><div><small class="subtle">Exit reason</small><div>${esc(t.reason)}</div></div></div><p style="margin-top:10px"><small class="subtle">ENTRY PLAN</small><br>${esc(t.thesis)}</p><div class="field"><label for="reflection-${t.id}">Posttrade reflection (minimum 15 characters for journal credit)</label><textarea id="reflection-${t.id}" rows="3" placeholder="Did I follow the plan? What did I learn?">${esc(t.reflection||'')}</textarea></div><button class="btn sm" style="margin-top:11px" data-action="save-reflection" data-id="${t.id}">Save review</button></article>`).join('')}</div>`}`;}
function performance(){const p=perf();const last=data.balanceHistory;return `<div class="section-heading" style="margin-top:0"><div><div class="eyebrow">Performance analytics</div><h1>Review the distribution, not the last trade.</h1><p class="muted">Statistics come only from your synthetic practice trades.</p></div></div><div class="grid grid-4">${metric('Total simulated P&L',`<span class="${valueClass(p.pnl)}">${fmt(p.pnl)}</span>`,'Closed practice orders','activity')}${metric('Win rate',`${p.winRate}%`,`${p.wins} wins · ${p.losses} losses`,'target')}${metric('Expectancy / trade',fmt(p.expectancy),'Average net result per closed trade','calculator')}${metric('Max balance drawdown',pct(p.maxDD),'Peak-to-trough closed balance','shield')}</div><div class="grid grid-2" style="margin-top:18px"><div class="card"><h3>Balance history</h3><div id="equitySparkline" style="min-height:200px"></div><p class="caption">Realized balance only. Floating equity between trades is not charted.</p></div><div class="card"><h3>Process scorecard</h3><div class="kv"><span>Practice trades completed</span><strong>${p.count}</strong></div><div class="kv"><span>Trades with written reflections</span><strong>${p.journalled}</strong></div><div class="kv"><span>Reflection coverage</span><strong>${p.journalRate}%</strong></div><div class="kv"><span>Profit factor</span><strong>${p.profitFactor===null?'No losses recorded':p.profitFactor}</strong></div><div class="kv"><span>Worst balance drawdown</span><strong>${p.maxDD}%</strong></div><div class="divider"></div><p class="notice">Small samples do not establish a genuine advantage. A good backtest or synthetic practice result is not evidence of likely real-world profit.</p></div></div><div class="section-heading"><h2>Completed orders</h2></div><div class="card table-wrap">${!data.trades.length?'<div class="empty">No closed practice orders yet. Your statistics will appear here once you trade in the lab.</div>':`<table><thead><tr><th>Trade</th><th>Pair</th><th>Side</th><th>Lots</th><th>Exit reason</th><th>Result</th><th>R</th></tr></thead><tbody>${data.trades.slice().reverse().map((t,i)=>`<tr><td>#${data.trades.length-i}</td><td>${t.pair}</td><td>${t.side}</td><td>${t.lots.toFixed(2)}</td><td>${esc(t.reason)}</td><td class="${valueClass(t.pnl)}">${fmt(t.pnl)}</td><td>${L.round(t.pnl/t.risk,2)}</td></tr>`).join('')}</tbody></table>`}</div>`;}
function readiness(){const p=perf();const approved=[
  {ok:passed()===20,title:'Complete all 20 lessons',detail:`${passed()} / 20 lesson quizzes passed`,goal:'Reach at least 75% on each four-question quiz.'},
  {ok:!!data.exam&&data.exam.score>=85,title:'Pass final knowledge exam',detail:data.exam?`${data.exam.score}% final assessment`:'Not completed',goal:'Score at least 85% across 20 questions.'},
  {ok:data.plan.trim().length>=60,title:'Write a full trading plan',detail:`${data.plan.trim().length} characters written`,goal:'Record setup, limits, hours, and no-trade criteria.'},
  {ok:p.count>=30,title:'Complete 30 synthetic practice trades',detail:`${p.count} / 30 closed trades`,goal:'Document a repeatable process across outcomes.'},
  {ok:p.count>=30&&p.journalRate>=90,title:'Review at least 90% of trades',detail:`${p.journalRate}% reviewed`,goal:'Write a substantial posttrade reflection.'},
  {ok:p.count>=30&&p.maxDD<=8,title:'Keep demo drawdown at or below 8%',detail:`${p.maxDD}% worst realized drawdown`,goal:'Rehearse protecting capital. Monitor losses and stops.'}
];return approved;}
function assessment(){const checks=readiness();const count=checks.filter(x=>x.ok).length;const ready=count===checks.length;return `<div class="section-heading" style="margin-top:0"><div><div class="eyebrow">Mastery pathway</div><h1>Earn evidence of discipline.</h1><p class="muted">Course milestones are learning benchmarks, not financial accreditation or approval for live trading.</p></div><span class="chip ${ready?'teal':'orange'}">${count} / 6 milestones</span></div><div class="grid grid-2"><div class="card"><div class="inline-actions"><div class="score-circle" style="--pct:${count/6*100}%"><div>${count}/6</div></div><div><h2>${ready?'Training milestones met':'Your readiness checklist'}</h2><p class="muted">Master the terms, practice the process, and protect your simulated equity.</p></div></div><div class="readiness-grid" style="margin-top:22px">${checks.map(c=>`<div class="readiness-item ${c.ok?'done':''}"><span class="state-icon">${c.ok?icon('check'):'·'}</span><div><strong>${esc(c.title)}</strong><small>${esc(c.goal)}</small></div><span class="state-text">${esc(c.detail)}</span></div>`).join('')}</div></div><div class="card"><div class="eyebrow">Knowledge assessment</div><h2>Final exam</h2><p class="muted" style="margin:13px 0 17px">Twenty questions, one drawn from each lesson. Passing threshold: 17 of 20 correct. Retakes are available.</p>${data.exam?`<div class="result-box"><strong class="${data.exam.score>=85?'accent':'warning'}">Last score: ${data.exam.score}%</strong><p class="muted">${data.exam.score>=85?'Knowledge assessment passed.':'Review lessons you missed and try again.'}</p></div>`:''}${!examQuestions.length?`<button class="btn" data-action="start-exam">Start 20-question exam ${icon('arrow')}</button>`:`<div class="quiz">${examQuestions.map((item,i)=>{const q=item.question,sel=examDraft[i],review=examFeedback!==null;return `<div class="question"><h4>${i+1}. ${esc(q.question)}</h4><div class="options">${q.answers.map((a,j)=>`<button class="option ${review&&j===q.correct?'right':review&&sel===j&&j!==q.correct?'wrong':sel===j?'chosen':''}" data-exam-answer="${i}" data-opt="${j}" ${review?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(a)}</button>`).join('')}</div>${review?`<p class="rationale">${esc(q.why)} · ${esc(item.lesson.title)}</p>`:''}</div>`;}).join('')}${examFeedback===null?`<button class="btn" data-action="grade-exam">Grade assessment</button>`:`<div class="result-box"><strong class="${examFeedback>=85?'accent':'warning'}">${examFeedback}% · ${examFeedback>=85?'Passed':'Not yet passed'}</strong><p class="muted">Review the explanations, then attempt another exam.</p><button class="btn secondary" data-action="start-exam">Retake assessment</button></div>`}</div>`}</div></div><div class="callout amber" style="margin-top:18px"><strong>After the app</strong><p style="margin-top:9px">Use an independent, regulated broker's live-price demo for a substantial additional period. Check actual spreads, commissions, news slippage, margin rules, and trading hours. Keep long-term savings and household expenses separate from speculative trading. Course completion does not establish that a live strategy is profitable.</p><a href="https://www.nfa.futures.org/basicnet/" rel="noopener noreferrer" target="_blank">Check broker records in NFA BASIC</a> · <a href="https://www.cftc.gov/LearnAndProtect/forexfrauds" target="_blank" rel="noopener noreferrer">CFTC forex investor information</a></div>`;}

.gov/LearnAndProtect/forexfrauds" target="_blank" rel="noopener noreferrer">CFTC: Forex Frauds</a></li><li><a href="https://www.nfa.futures.org/basicnet/" target="_blank" rel="noopener noreferrer">NFA BASIC: Registration and disciplinary records</a></li></ul></div></div>`;}

function updateOrderSizing(){const out=document.getElementById('orderSizing');if(!out)return;const stop=Number(document.getElementById('orderStop').value),target=Number(document.getElementById('orderTarget').value),risk=Number(document.getElementById('orderRisk').value),side=document.getElementById('orderSidePreview').value;
const pos=tradePreview(side,risk,stop,target);if(!pos||!Number.isFinite(target)||target<=0){out.innerHTML='<div class="warning">Choose valid risk, stop, and target settings.</div>';return;}const free=equity()-(data.open?.margin||0);const safe=pos.lots>0&&pos.margin<=free;
out.innerHTML=`<div class="kv"><span>Calculated position size</span><strong>${pos.lots.toFixed(2)} standard lots</strong></div><div class="kv"><span>Planned stop exposure</span><strong>${fmt(pos.actualRisk)} / ${fmt(pos.budget)}</strong></div><div class="kv"><span>Target payoff, before extra costs</span><strong>${fmt(pos.potentialReward)}</strong></div><div class="kv"><span>Target / stop distance</span><strong>${L.round(target/stop,2)} : 1</strong></div><div class="kv"><span>Initial margin at 20:1</span><strong>${fmt(pos.margin)}</strong></div>${safe?'<div class="caption">Size rounds down to prevent exceeding planned risk.</div>':'<div class="warning" style="font-size:12px">Trade blocked: size below 0.01 lot or insufficient margin.</div>'}`;}
function updateCalc(){const target=document.getElementById('calcResults');if(!target)return;const balance=Number(document.getElementById('calcBalance').value),risk=Number(document.getElementById('calcPct').value),stop=Number(document.getElementById('calcStop').value),pair=document.getElementById('calcPair').value;const pos=L.positionSize(balance,risk,stop,pair);if(!pos || !Number.isFinite(stop) || stop>2000){target.innerHTML='<p class="warning">Enter a valid equity balance, risk percentage, and stop distance.</p>';return;}target.innerHTML=`<div class="eyebrow">Calculated position size</div><div class="big">${pos.lots.toFixed(2)} <small style="font-size:20px">lots</small></div><div class="muted" style="margin-top:8px">${pos.lots>0?`Approximately ${(pos.lots*100000).toLocaleString()} base units`:'Below a 0.01-lot minimum. Skip the trade.'}</div><div class="divider"></div><div class="kv"><span>Maximum planned risk budget</span><strong>${fmt(pos.budget)}</strong></div><div class="kv"><span>Planned risk after rounding</span><strong>${fmt(pos.actualRisk)}</strong></div><div class="kv"><span>Risk as % of equity</span><strong>${pct(pos.riskPctActual)}</strong></div><div class="kv"><span>Pip value at size</span><strong>${fmt(L.pipValue(pos.lots,pair))}/pip</strong></div><div class="kv"><span>Position notional at illustrative rate</span><strong>${fmt(pos.lots*100000*L.PAIRS[pair].base)}</strong></div><div class="divider"></div><small>Calculation assumes a stop filled exactly at its price. Gaps and slippage can create larger losses.</small>`;}
function openTrade(side){if(data.open){toast('Close the current position first.');return;}if(sessionHalt()){toast('Your 2% session loss limit has paused new entries.');return;}if(data.market.index>=getCandles().length-1){toast('Start a new scenario to trade.');return;}
const risk=Number(document.getElementById('orderRisk').value),stop=Number(document.getElementById('orderStop').value),target=Number(document.getElementById('orderTarget').value),thesis=document.getElementById('tradeThesis').value.trim();
if(![risk,stop,target].every(Number.isFinite)||![.25,.5,1].includes(risk)||stop<5||stop>250||!Number.isInteger(stop)||target<5||target>500||!Number.isInteger(target)){toast('Use valid risk, stop and target settings.');return;}
if(thesis.length<12){toast('Write at least 12 characters explaining your trade.');return;}
if(!['ruleSetup','ruleEvent','ruleRisk'].every(id=>document.getElementById(id).checked)){toast('Confirm all three checklist items before entering.');return;}
const pos=tradePreview(side,risk,stop,target);if(!pos||pos.lots<.01){toast('Your chosen risk is too small for the minimum 0.01 lot. Skip this setup.');return;}
if(pos.margin>equity()){toast('Insufficient free equity for the required margin.');return;}
const p=L.PAIRS[data.market.pair].pip;
data.open={id:Date.now(),pair:data.market.pair,side,lots:pos.lots,entry:pos.entry,sl:L.round(pos.entry+(side==='BUY'?-1:1)*stop*p,5),tp:L.round(pos.entry+(side==='BUY'?1:-1)*target*p,5),risk:pos.actualRisk,margin:pos.margin,thesis,scenario:data.market.mode==='csv'?'Historical CSV':data.market.scenario,entryIndex:data.market.index,date:new Date().toLocaleDateString('en-US'),reflection:''};save();render();toast(`${side} opened in the synthetic practice market.`);
}
function closeTrade(exitPrice,reason){const t=data.open;if(!t)return;const price=L.round(exitPrice,5);const pnl=L.round((t.side==='BUY'?1:-1)*(price-t.entry)*100000*t.lots,2);const closed={...t,exit:price,pnl,reason,closeIndex:data.market.index};data.balance=L.round(data.balance+pnl);data.sessionPnL=L.round(data.sessionPnL+pnl);data.trades.push(closed);data.balanceHistory.push(data.balance);data.open=null;save();toast(`Demo position closed: ${fmt(pnl)} (${reason}).`);}
function nextBars(count){const all=getCandles();for(let k=0;k<count&&data.market.index<all.length-1;k++){data.market.index++;if(data.open){const exit=L.checkExit(data.open,candle(),spread(),data.market.mode==='csv'?'Range':data.market.scenario);if(exit)closeTrade(exit.price,exit.reason);}}
if(data.market.index===all.length-1&&data.open){const t=data.open;const marketClose=L.quote(candle().close,t.pair,spread());closeTrade(t.side==='BUY'?marketClose.bid:marketClose.ask,'Scenario ended');}save();render();}
function newScenario(){if(data.open){toast('Close your position before changing scenarios.');return;}const pair=document.getElementById('marketPair')?.value||data.market.pair;const scenario=document.getElementById('marketScenario')?.value||data.market.scenario;const mode=document.getElementById('marketSource')?.value||'synthetic';if(!L.PAIRS[pair]||!L.SCENARIOS.includes(scenario))return;if(mode==='csv'&&(!data.imported||data.imported.pair!==pair)){toast('Import an OHLC CSV for the selected currency pair first.');return;}data.market={pair,scenario,mode,seed:Math.floor(Math.random()*2147483646)+1,index:85};data.sessionStart=data.balance;data.sessionPnL=0;save();render();toast('New simulated session started. Previous trades remain in your journal.');}
function manualClose(){const t=data.open;if(!t)return;const q=L.quote(candle().close,t.pair,spread());closeTrade(t.side==='BUY'?q.bid:q.ask,'Manual close');render();}
function gradeQuiz(id){const lesson=lessons.find(l=>l.id===id);if(!lesson)return;const ans=quizDraft[id]||{};if(Object.keys(ans).length!==4){toast('Answer all four questions before grading.');return;}const correct=lesson.questions.filter((q,i)=>ans[i]===q.correct).length;const score=correct*25;quizFeedback[id]=score;if(score>=75){data.completed[id]=Math.max(data.completed[id]||0,score);save();}render();toast(score>=75?'Lesson passed. Progress saved.':'Review the explanations and retry.');}
function startExam(){examQuestions=lessons.map(l=>({lesson:l,question:l.questions[Math.floor(Math.random()*l.questions.length)]}));examDraft={};examFeedback=null;render();}
function gradeExam(){if(Object.keys(examDraft).length!==examQuestions.length){toast('Answer all 20 questions first.');return;}const n=examQuestions.filter((x,i)=>examDraft[i]===x.question.correct).length;examFeedback=n/20*100;if(!data.exam||examFeedback>data.exam.score)data.exam={score:examFeedback,date:new Date().toISOString()};save();render();toast(examFeedback>=85?'Knowledge exam passed.':'Review missed answers before retaking.');}
function drawChart(){const canvas=document.getElementById('priceChart');if(!canvas)return;const rect=canvas.getBoundingClientRect();const width=Math.round(rect.width),height=Math.round(rect.height);if(!width||!height)return;const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,width,height);
const end=data.market.index,start=Math.max(0,end-(width<470?38:64)),series=getCandles().slice(start,end+1);const left=11,right=width-75,top=19,bottom=height-32;const vals=series.flatMap(c=>[c.high,c.low]);if(data.open)vals.push(data.open.entry,data.open.sl,data.open.tp);let min=Math.min(...vals),max=Math.max(...vals);const pad=Math.max((max-min)*.12,L.PAIRS[data.market.pair].pip*6);min-=pad;max+=pad;
const py=v=>top+(max-v)/(max-min)*(bottom-top);const step=(right-left)/Math.max(series.length,1);const px=i=>left+step*(i+.5);ctx.font='11px ui-sans-serif,system-ui';ctx.textBaseline='middle';
for(let n=0;n<=5;n++){const y=top+(bottom-top)*n/5;ctx.strokeStyle='#223248';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();ctx.fillStyle='#7990a8';ctx.fillText((max-(max-min)*n/5).toFixed(5),right+6,y);}
const moving=(span)=>{const all=getCandles(),values=[];let prev=all[0].close;const k=2/(span+1);for(let i=0;i<=end;i++){prev=i===0?all[i].close:all[i].close*k+prev*(1-k);values.push(prev);}return values.slice(start,end+1);};
const drawEMA=(length,color)=>{const arr=moving(length);ctx.strokeStyle=color;ctx.lineWidth=1.7;ctx.beginPath();arr.forEach((v,i)=>{if(i===0)ctx.moveTo(px(i),py(v));else ctx.lineTo(px(i),py(v));});ctx.stroke();};
const bw=Math.max(2,Math.min(9,step*.58));series.forEach((c,i)=>{const rising=c.close>=c.open;ctx.strokeStyle=ctx.fillStyle=rising?'#55d8b8':'#e8788e';const x=px(i);ctx.lineWidth=Math.max(1,bw*.18);ctx.beginPath();ctx.moveTo(x,py(c.high));ctx.lineTo(x,py(c.low));ctx.stroke();const a=py(c.open),b=py(c.close);ctx.fillRect(x-bw/2,Math.min(a,b),bw,Math.max(1.5,Math.abs(a-b)));});
drawEMA(50,'#7ba9ff');drawEMA(20,'#61e8bd');
if(data.open){const lines=[[data.open.entry,'#f4bd6c','ENTRY'],[data.open.sl,'#ff8b94','STOP'],[data.open.tp,'#57e4c3','TARGET']];for(const [v,color,label] of lines){const y=py(v);ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle=color;ctx.globalAlpha=.85;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=color;ctx.font='bold 10px ui-sans-serif,system-ui';ctx.fillText(label,right-52,y-10);ctx.restore();}}
ctx.fillStyle='#8297ac';ctx.font='10px ui-sans-serif,system-ui';ctx.fillText(`BAR ${start+1}`,left,bottom+17);ctx.fillText(`BAR ${end+1}`,Math.max(left,right-54),bottom+17);
}
function drawEquity(){const node=document.getElementById('equitySparkline');if(!node)return;const arr=data.balanceHistory;if(arr.length<2){node.innerHTML='<div class="empty" style="margin-top:14px">Balance graph appears after your first closed trade.</div>';return;}const min=Math.min(...arr),max=Math.max(...arr),pad=(max-min)||1;const w=650,h=190;const points=arr.map((v,i)=>`${15+i/(arr.length-1)*(w-30)},${h-22-(v-min)/pad*(h-38)}`).join(' ');node.innerHTML=`<svg viewBox="0 0 ${w} ${h}" aria-label="Realized balance history" role="img" width="100%" height="190"><defs><linearGradient id="lineBg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#57e4c3" stop-opacity=".23"/><stop offset="1" stop-color="#57e4c3" stop-opacity="0"/></linearGradient></defs><line x1="15" x2="635" y1="165" y2="165" stroke="#2a3a50" stroke-dasharray="4 4"/><polygon points="15,168 ${points} 635,168" fill="url(#lineBg)"/><polyline points="${points}" fill="none" stroke="#57e4c3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="15" y="15" fill="#a9bacd" font-size="13">High ${fmt(max)}</text><text x="15" y="184" fill="#a9bacd" font-size="13">Low ${fmt(min)}</text></svg>`;}
function backup(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pipwise-progress-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported. Save it somewhere safe.');}
function importHistory(file){
if(!file)return;
if(data.open){toast('Close the open trade before importing a different market.');return;}
if(file.size>2_000_000){toast('CSV exceeds 2 MB. Use up to 2,000 OHLC rows.');return;}
const pair=document.getElementById('marketPair')?.value||data.market.pair;
const reader=new FileReader();reader.onload=()=>{try{
const raw=String(reader.result||'').replace(/^\uFEFF/,'');
const lines=raw.split(/\r?\n/).filter(l=>l.trim());if(lines.length<101)throw Error('Need at least 100 candles');
const delim=lines[0].includes(';')?';':',';
const cells=line=>{let values=[],token='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){token+='"';i++;}else quoted=!quoted;}else if(ch===delim&&!quoted){values.push(token.trim());token='';}else token+=ch;}values.push(token.trim());return values;};
const keys=cells(lines[0]).map(x=>x.toLowerCase().replace(/[<>_\s]/g,''));
const cols=['open','high','low','close'].map(k=>keys.indexOf(k));if(cols.some(i=>i<0))throw Error('Missing open/high/low/close columns');
const bars=[];
for(const line of lines.slice(1,2001)){const row=cells(line);const a=cols.map(n=>Number(row[n]));if(a.some(v=>!Number.isFinite(v)||v<=0))continue;const [open,high,low,close]=a;if(high<Math.max(open,close,low)||low>Math.min(open,close,high))continue;bars.push({open:L.round(open,5),high:L.round(high,5),low:L.round(low,5),close:L.round(close,5)});}
if(bars.length<100)throw Error('Not enough valid OHLC rows');
if(!confirm(`Import ${bars.length} historical OHLC candles as ${pair}? Choose the correct currency pair and use chronological CSV data.`))return;
data.imported={pair,name:file.name.slice(0,65),candles:bars};data.market={pair,scenario:'Range',mode:'csv',seed:0,index:85};data.sessionStart=data.balance;data.sessionPnL=0;save();render();toast(`${bars.length} historical candles imported for practice replay.`);
}catch(err){toast(`CSV not imported: ${err.message}`);}};reader.readAsText(file);
}
function resetTrades(){if(!confirm('Reset only your practice balance and trade journal? Lessons and exam will remain.'))return;data.balance=10000;data.balanceHistory=[10000];data.trades=[];data.open=null;data.market={pair:'EUR/USD',scenario:'Uptrend',mode:'synthetic',seed:101,index:85};data.sessionStart=10000;data.sessionPnL=0;save();render();toast('Practice account reset.');}
function resetAll(){if(!confirm('Erase all lessons, exam, journal, account, and plan in this browser? Export first if you need a backup.'))return;data=defaults();selectedLesson=lessons[0].id;quizDraft={};quizFeedback={};examQuestions=[];examDraft={};examFeedback=null;save();setView('dashboard');toast('Fresh local learning account created.');}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(x.version!==1||!Array.isArray(x.trades)||!Array.isArray(x.balanceHistory)||!x.market||!L.PAIRS[x.market.pair]||!L.SCENARIOS.includes(x.market.scenario)||!Number.isFinite(x.balance)||!x.completed||typeof x.completed!=='object')throw Error('Invalid backup');if(!confirm('Replace all current local progress with the selected backup?'))return;data={...defaults(),...x};delete data.exportedAt;save();setView('dashboard');toast('Backup imported.');}catch{toast('Import failed. Select a valid Pipwise JSON backup.');}};reader.readAsText(file);}
function handleClick(ev){const el=ev.target.closest('button[data-nav],button[data-lesson],button[data-stage],button[data-answer-lesson],button[data-exam-answer],button[data-action],button[data-filter]');if(!el)return;
if(el.dataset.nav){setView(el.dataset.nav);return;}
if(el.dataset.stage!==undefined){selectedLesson=lessons.find(l=>l.stage===Number(el.dataset.stage)).id;setView('academy');return;}
if(el.dataset.lesson){selectedLesson=el.dataset.lesson;setView('academy');return;}
if(el.dataset.answerLesson){const id=el.dataset.answerLesson;quizDraft[id]=quizDraft[id]||{};quizDraft[id][Number(el.dataset.q)]=Number(el.dataset.opt);render();return;}
if(el.dataset.examAnswer!==undefined){examDraft[Number(el.dataset.examAnswer)]=Number(el.dataset.opt);render();return;}
if(el.dataset.filter){currentJournalFilter=el.dataset.filter;render();return;}
const action=el.dataset.action,id=el.dataset.id;
if(action==='submit-quiz')gradeQuiz(id);
if(action==='retry-quiz'){delete quizFeedback[id];quizDraft[id]={};render();}
if(action==='start-exam')startExam();
if(action==='grade-exam')gradeExam();
if(action==='new-scenario')newScenario();
if(action==='next-bar')nextBars(Number(el.dataset.count)||1);
if(action==='open-trade')openTrade(el.dataset.side);
if(action==='close-trade')manualClose();
if(action==='save-plan'){const txt=document.getElementById('planInput')?.value||'';data.plan=txt.slice(0,12000);save();toast('Trading plan saved.');}
if(action==='save-reflection'){const t=data.trades.find(t=>String(t.id)===id);if(t){t.reflection=(document.getElementById('reflection-'+id)?.value||'').slice(0,10000);save();render();toast('Journal reflection saved.');}}
if(action==='export')backup();
if(action==='reset-trades')resetTrades();
if(action==='reset-all')resetAll();
}
document.addEventListener('click',handleClick);
document.addEventListener('change',ev=>{const id=ev.target?.id;if(id==='importFile')importData(ev.target.files[0]);if(id==='csvFile')importHistory(ev.target.files[0]);if(['orderRisk','orderStop','orderTarget','orderSidePreview'].includes(id))updateOrderSizing();if(['calcBalance','calcPct','calcStop','calcPair'].includes(id))updateCalc();});
document.addEventListener('input',ev=>{const id=ev.target?.id;if(['orderStop','orderTarget'].includes(id))updateOrderSizing();if(['calcBalance','calcStop'].includes(id))updateCalc();if(id==='glossarySearch'){glossaryTerm=ev.target.value;const out=document.getElementById('glossaryResults');if(out){const found=glossary.filter(([t,d])=>(t+' '+d).toLowerCase().includes(glossaryTerm.toLowerCase()));out.innerHTML=found.map(([term,def])=>`<div class="glossary-card"><h4>${esc(term)}</h4><p>${esc(def)}</p></div>`).join('')||'<div class="empty">No matching term.</div>';}}});
window.addEventListener('resize',()=>{if(view==='lab')drawChart();});
render();
})();

</script>
